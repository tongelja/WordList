# Builds the static WordList site and publishes it to Azure Static Web Apps.
# Runs on every push to master, and on demand from the Actions tab.
name: Deploy to Azure

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Build site
        working-directory: wordlist
        run: uv run python build_static.py --out ../dist

      - name: Publish to Azure
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
          skip_api_build: true
