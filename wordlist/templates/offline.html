{% extends 'base.html' %}
{% block title %}Offline · WordList{% endblock %}
{% block content %}
<section class="intro">
  <h1>You're offline</h1>
  <p>That word hasn't been saved on this device yet. These words are available offline:</p>
  <ul id="saved" class="word-grid"></ul>
  <p id="none" hidden>No words saved yet. Words you open while online are kept for offline reading.</p>
</section>

<script>
  (async () => {
    const names = (await caches.keys()).filter(n => n.startsWith('wordlist-'));
    const requests = (await Promise.all(names.map(n => caches.open(n).then(c => c.keys())))).flat();
    const saved = new Set(requests.map(r => new URL(r.url).pathname).filter(p => p.startsWith('/word/')));

    // Show proper names ("Hobson's choice") using the cached word list.
    const list = await fetch('/api/words.json').then(r => r.json()).catch(() => []);
    const words = list.filter(w => saved.has(w.url));

    const ul = document.getElementById('saved');
    for (const w of words) {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = w.url;
      a.textContent = w.word;
      li.append(a);
      ul.append(li);
    }
    document.getElementById('none').hidden = words.length > 0;
  })();
</script>
{% endblock %}
