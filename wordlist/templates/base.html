<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}WordList{% endblock %}</title>
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='icons/favicon-32.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
  <meta name="theme-color" content="#8a4b14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="WordList">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=Lato:ital,wght@0,400;0,700;1,400&family=Gentium+Book+Plus&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ asset('styles.css') }}">
  <script src="{{ asset('favorites.js') }}"></script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8-4.3-4.1 5.9-.8z"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M3 7h3.5c4 0 6 10 10 10H21M3 17h3.5c1.6 0 2.8-1.6 3.9-3.6M13.6 9.6C14.7 8 15.6 7 17 7h4M18 4l3 3-3 3M18 14l3 3-3 3"/></symbol>
    <symbol id="i-speaker" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 010 6M18 6.5a7.5 7.5 0 010 11"/></symbol>
  </svg>
  <header class="bar">
    <div class="bar-row">
      <button class="back" type="button" onclick="history.back()" aria-label="Back">‹</button>
      <a class="brand" href="{{ url_for('index') }}">WordList</a>
      <nav class="bar-icons">
        <button type="button" class="icon" id="search-toggle" aria-label="Search" title="Look up a word" aria-expanded="false" aria-controls="search"><svg class="i"><use href="#i-search"/></svg></button>
        <a class="icon" data-random href="{{ url_for('random_word') }}" aria-label="Random word" title="Random word from your list"><svg class="i"><use href="#i-shuffle"/></svg></a>
        <a class="icon" href="{{ url_for('favorites') }}" aria-label="Favorites" title="Your favorite words"><svg class="i"><use href="#i-star"/></svg></a>
      </nav>
    </div>
    <form class="search" id="search" action="{{ url_for('index') }}" hidden>
      <input name="q" id="q" list="words" placeholder="Look up a word…" autocomplete="off" aria-label="Look up a word" enterkeyhint="go">
      <datalist id="words"></datalist>
    </form>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    Definitions, pronunciations and etymologies from
    <a href="https://en.wiktionary.org/">Wiktionary</a>, available under
    <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>.
  </footer>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');

    // The word list is loaded once from /api/words.json (and cached offline)
    // rather than repeated in every page.
    let wordList = null;
    const norm = s => s.trim().toLowerCase().replace(/[’']/g, "'").replace(/_/g, ' ');
    function loadWords() {
      wordList = wordList || fetch('/api/words.json').then(r => r.json()).then(list => {
        const datalist = document.getElementById('words');
        for (const w of list) {
          const opt = document.createElement('option');
          opt.value = w.word;
          datalist.append(opt);
        }
        return list;
      });
      return wordList;
    }
    document.getElementById('q').addEventListener('focus', loadWords, { once: true });

    // The magnifier opens and closes the search box.
    const searchForm = document.getElementById('search');
    const searchToggle = document.getElementById('search-toggle');
    function showSearch(open) {
      searchForm.hidden = !open;
      searchToggle.setAttribute('aria-expanded', String(open));
      if (open) document.getElementById('q').focus();
    }
    searchToggle.addEventListener('click', () => showSearch(searchForm.hidden));
    document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Escape') showSearch(false); });
    document.addEventListener('keydown', e => {
      if (e.key === '/' && !/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) { e.preventDefault(); showSearch(true); }
    });

    document.getElementById('search').addEventListener('submit', async e => {
      e.preventDefault();
      const q = e.target.q.value.trim();
      if (!q) return;
      const list = await loadWords().catch(() => []);
      const match = list.find(w => norm(w.word) === norm(q));
      location.href = match ? match.url : '/word/' + encodeURIComponent(q.replace(/ /g, '_'));
    });

    document.querySelectorAll('[data-random]').forEach(link => link.addEventListener('click', async e => {
      e.preventDefault();
      const list = await loadWords().catch(() => []);
      location.href = list.length ? list[Math.floor(Math.random() * list.length)].url : link.href;
    }));
  </script>
</body>
</html>
