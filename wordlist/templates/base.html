<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}WordList{% endblock %}</title>
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='icons/favicon-32.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
  <meta name="theme-color" content="#8a4b14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="WordList">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=Lato:ital,wght@0,400;0,700;1,400&family=Gentium+Book+Plus&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <script src="{{ url_for('static', filename='favorites.js') }}"></script>
</head>
<body>
  <header class="bar">
    <button class="back" type="button" onclick="history.back()" aria-label="Back">‹</button>
    <a class="brand" href="{{ url_for('index') }}">WordList</a>
    <form class="search" id="search" action="{{ url_for('index') }}">
      <input name="q" id="q" list="words" placeholder="Look up a word…" autocomplete="off" aria-label="Look up a word">
      <datalist id="words"></datalist>
    </form>
    <a class="button" href="{{ url_for('favorites') }}" title="Your favorite words" aria-label="Favorites">★</a>
    <a class="button" data-random href="{{ url_for('random_word') }}" title="Random word from your list">Random</a>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    Definitions, pronunciations and etymologies from
    <a href="https://en.wiktionary.org/">Wiktionary</a>, available under
    <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>.
  </footer>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');

    // The word list is loaded once from /api/words.json (and cached offline)
    // rather than repeated in every page.
    let wordList = null;
    const norm = s => s.trim().toLowerCase().replace(/[’']/g, "'").replace(/_/g, ' ');
    function loadWords() {
      wordList = wordList || fetch('/api/words.json').then(r => r.json()).then(list => {
        const datalist = document.getElementById('words');
        for (const w of list) {
          const opt = document.createElement('option');
          opt.value = w.word;
          datalist.append(opt);
        }
        return list;
      });
      return wordList;
    }
    document.getElementById('q').addEventListener('focus', loadWords, { once: true });

    document.getElementById('search').addEventListener('submit', async e => {
      e.preventDefault();
      const q = e.target.q.value.trim();
      if (!q) return;
      const list = await loadWords().catch(() => []);
      const match = list.find(w => norm(w.word) === norm(q));
      location.href = match ? match.url : '/word/' + encodeURIComponent(q.replace(/ /g, '_'));
    });

    document.querySelectorAll('[data-random]').forEach(link => link.addEventListener('click', async e => {
      e.preventDefault();
      const list = await loadWords().catch(() => []);
      location.href = list.length ? list[Math.floor(Math.random() * list.length)].url : link.href;
    }));
  </script>
</body>
</html>
